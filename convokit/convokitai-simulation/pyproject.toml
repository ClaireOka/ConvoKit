# Install for local development (from the repository root), together with ConvoKit, which
# includes the `convokitai` package:
#   python -m pip install -e . -e ./convokit/convokitai-simulation
# Install from GitHub:
#   pip install "git+https://github.com/CornellNLP/ConvoKit.git@master#subdirectory=convokit/convokitai-simulation"
[project]
name = "dl-sim"
version = "0.1.0"
description = "Run AI agent conversation simulations on a ConvoArena backend and load them as convokitai corpora"
requires-python = ">=3.12"
dependencies = [
    # ConvoKit 5.0.0 is the first release that includes the `convokitai` package
    "convokit>=5.0.0",
    "pydantic>=2.0",
    "python-dotenv",
    "requests",
    "pandas",
    "udocker",
    "pyyaml",
    "tqdm",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deliberate_lab"]
py-modules = ["local_backend", "dl_container", "simulation", "create_simulation", "export_to_corpus"]
