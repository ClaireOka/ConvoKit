[project]
name = "dl-sim"
version = "0.1.0"
description = "Run Deliberate Lab agent simulations against the backend container"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv",
    "requests",
    "pandas",
    "udocker",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deliberate_lab"]
py-modules = ["local_backend", "dl_container", "simulation", "create_simulation"]
