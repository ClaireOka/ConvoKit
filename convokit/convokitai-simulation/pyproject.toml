# Install with:
#   pip install "git+https://github.com/CornellNLP/ConvoKit.git@master#subdirectory=convokit/convokitai-simulation"
[project]
name = "dl-sim"
version = "0.1.0"
description = "Run AI agent conversation simulations on a ConvoArena backend and load them as convokitai corpora"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv",
    "requests",
    "pandas",
    "udocker",
    "pyyaml",
    "tqdm",
    # also requires convokitai, which is installed with ConvoKit from this repository
    # (see convokit/convokitai/pyproject.toml)
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["deliberate_lab"]
py-modules = ["local_backend", "dl_container", "simulation", "create_simulation", "export_to_corpus"]
