# `convokitai` is installed together with `convokit` by the repository's root setup.py:
#   pip install "git+https://github.com/CornellNLP/ConvoKit.git@master"
#
# This file builds `convokitai` on its own, without the rest of ConvoKit's source. Don't install
# both ways into the same environment, since each provides the top-level `convokitai` package.
#
# Install from GitHub:
#   pip install "git+https://github.com/CornellNLP/ConvoKit.git@master#subdirectory=convokit/convokitai"
# Install for local development (from the repository root):
#   python -m pip install -e ./convokit/convokitai

[project]
name = "convokitai"
version = "0.1.0"
description = "ConvoKit's data model extended with AI speakers, private assistants, and support messages"
requires-python = ">=3.12"
dependencies = [
    "convokit>=4.1",
    # simulation dependencies (e.g. deliberate-lab) are not needed here; they are declared in
    # convokit/convokitai-simulation/pyproject.toml
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# this folder is itself the `convokitai` package
packages = ["convokitai"]
package-dir = { "convokitai" = "." }
